<style>
:root {
  color-scheme: light;
  --bg: #f3f3f1;
  --panel: #fafafa;
  --ink: #1c1c1a;
  --muted: #6b6b66;
  --line: #d6d6d0;
  --accent: #2f6fd0;
  --accent-ink: #ffffff;
  --warn: #aa1e1e;
  --zbg: #fff5cd;
  --zline: #e3c968;
  --radius: 6px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 13px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink); background: var(--bg);
  display: flex; flex-direction: column;
}
header.top { padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
header.top h1 { margin: 0; font-size: 17px; font-weight: 700; }
header.top h1 span { font-weight: 400; color: var(--muted); }
header.top p { margin: 0; color: var(--muted); font-size: 12px; }
main.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 392px minmax(300px, 1fr) 392px; }
.col { overflow-y: auto; padding: 8px; background: var(--panel); }
#colL { border-right: 1px solid var(--line); }
#colR { border-left: 1px solid var(--line); }
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage { flex: 1; min-height: 0; position: relative; background: #e8e8e4; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
fieldset.grp { margin: 0 0 8px; padding: 6px 10px 8px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; min-width: 0; }
fieldset.grp > legend { font-weight: 700; padding: 0 4px; }
.row { display: grid; grid-template-columns: 150px 1fr 26px; align-items: center; gap: 6px; min-height: 32px; }
.row > label.lbl { color: var(--ink); }
.ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
input[type=number] { width: 80px; padding: 3px 4px; border: 1px solid #b9b9b2; border-radius: 3px; font: inherit; background: #fff; }
select { padding: 3px 4px; border: 1px solid #b9b9b2; border-radius: 3px; font: inherit; background: #fff; max-width: 100%; }
input:disabled, select:disabled { background: #eeeeea; color: #999; }
.chkrow { display: grid; grid-template-columns: 1fr 26px; align-items: center; gap: 6px; min-height: 30px; }
.chkrow label { display: flex; gap: 6px; align-items: flex-start; }
.chkrow input { margin-top: 2px; }
button { font: inherit; padding: 5px 10px; border: 1px solid #aaa9a2; border-radius: 4px; background: #f1f1ee; color: var(--ink); cursor: pointer; }
button:hover:not(:disabled) { background: #e7e7e3; }
button:disabled { color: #aaa; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button.primary:hover:not(:disabled) { background: #265fb4; }
button.help { width: 24px; height: 24px; padding: 0; font-weight: 700; border-radius: 4px; }
button.wide { width: 100%; }
.btnrow { display: flex; gap: 8px; margin: 4px 0 6px; flex-wrap: wrap; }
.btnrow button { flex: 1; min-width: 100px; }
.infotxt { white-space: pre-line; color: var(--ink); min-height: 40px; margin: 4px 0; }
.warntxt { white-space: pre-line; color: var(--warn); min-height: 18px; margin: 4px 0; }
.zbox { margin: 8px -4px; padding: 6px 8px 4px; background: var(--zbg); border: 1px solid var(--zline); border-radius: var(--radius); }
.zbox .ttl { font-weight: 700; margin: 0 0 2px; }
.zbox .row > label.lbl { font-weight: 700; }
#simbar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #f2f2ef; border-top: 1px solid var(--line); }
#simbar input[type=range] { flex: 1; min-width: 60px; }
#simTime { min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
footer#status { padding: 4px 12px; background: #ececE8; border-top: 1px solid var(--line); font-size: 12px; min-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.dlg { background: #fff; border-radius: 8px; max-width: 640px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.dlg.big { max-width: 860px; height: 86vh; }
.dlg h2 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--line); }
.dlg .body { padding: 12px 16px; overflow-y: auto; white-space: pre-wrap; flex: 1; }
.dlg.big .body { font-size: 13.5px; }
.dlg .btns { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dlg .links { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.dropmark { outline: 3px dashed var(--accent); outline-offset: -6px; }

  html, body { height: auto; }

  main.app { display: flex; flex-direction: column; }

  .col { overflow: visible; border: 0; }
}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;min-width:0}
.ctl input[type=number]{flex:1 1 0;width:0;min-width:48px}
.ctl select{flex:1 1 0;width:0;min-width:0}
.ctl span{white-space:nowrap;font-size:12px}
.ctl button{padding:3px 6px;white-space:nowrap}
.btnrow .help{width:26px;flex:none}
.modebtn{margin-left:auto;font-weight:600;background:#fff3d6;border:1px solid #d9a400;border-radius:6px;padding:4px 10px;cursor:pointer}
.extra-panel{border:1px solid #d5d5d1;border-radius:5px;background:white;margin:8px 0}.extra-panel>summary{padding:10px;cursor:pointer;font-weight:600}.extra-panel>.grp{border:0;margin:0}.extra-panel[open]>summary{border-bottom:1px solid #e5e5e0}
@media(max-width:600px){#simbar{flex-wrap:wrap}#simbar input[type=range]{flex:1 1 120px;min-width:80px}#simTime{min-width:70px}}
</style>

<body>
<header class="top">
  <h1>Homelab-Plotter Bambulab X2D</h1>
  <p>SVG to G-code for the 3D printer. Runs entirely in your browser, no data is uploaded.</p>
</header>
<main class="app">
  <aside class="col" id="colL"></aside>
  <section class="center">
    <div class="stage" id="stage"><canvas id="cv"></canvas></div>
    <div id="simbar"></div>
  </section>
  <aside class="col" id="colR"></aside>
</main>
<footer id="status">Ready. Load an SVG file first.</footer>
<input type="file" id="fileIn" accept=".svg,image/svg+xml" hidden>

<script type="application/json" id="texts">{"tips": {"svg": "The design is always loaded as an SVG file (vector graphic).\n\nPaths, rectangles, circles, ellipses, lines, polygons and polylines are used.\n• Shapes with a black or grey fill are outlined and (if desired) hatched.\n• Shapes with a visible stroke are drawn as a line. The stroke width does not matter; the centre line is drawn.\n• White-filled shapes count as cut-outs (e.g. white details on a black area) and are not drawn.\n• Convert text to paths first (Inkscape: Path > Object to Path). It will then be drawn as an outline, though (two lines per stroke).\n\nTEXT AS A SINGLE LINE: create it in Inkscape with the \"Hershey Text\" extension (step-by-step instructions under \"Guide …\" and in the README), save as SVG and load it here.\n\nTip: you can also simply drag the SVG file into the window.", "thick": "Makes the design thicker or thinner. 0 = unchanged.\n\nFilled shapes (e.g. letters converted to paths, or areas): the contour is shifted outwards by this amount (positive value, the shape gets thicker) or inwards (negative value, the shape gets thinner). White cut-outs behave the other way round. With hatching, the hatched area grows or shrinks too.\n\nPlain lines without fill (stroke lines): with a positive value the pen draws extra lines 0.35 mm to the left and right of the line. Overall the stroke becomes about twice as wide as the value. Negative values have no effect here (you can't go thinner than the pen).\n\nTip: choose small values (e.g. 0.1 to 0.3 mm). With thin shapes and negative values the shape may collapse or self-intersect; always check the result in the preview.\n\nThe change applies in millimetres on the paper, regardless of the width.", "bed": "Physical plate dimensions in mm, used to position the paper. Default: 260 × 260 mm. Head travel limits are independent and live under Head travel limits; plate size alone does not establish reachable nozzle coordinates.", "paper": "Width and height of your paper in mm. The selection above sets standard sizes.\n\nThe paper must fit completely on the print bed. An A4 sheet (210 × 297 mm) is too big for a 260 mm bed.", "corner": "Bed coordinate of the bottom-left paper corner in mm (X, Y). The origin (0/0) is the front-left corner of the print bed.\n\nThe paper must lie entirely on the bed. Check the position of the paper corner beforehand with a test stroke.", "margin": "Free margin all around between the paper edge and the drawing, in mm (grey dashed line in the preview). Prevents the pen from moving past the paper edge.", "width": "Width of the artwork on paper. Fit preserves its proportions and fits it within the paper margins and reachable pen area. Center positions it at the centre of that usable area without moving the paper.", "rot": "Rotates the design around its centre, in degrees. Positive values rotate clockwise (looking down at the paper).\n\nUse the buttons for 90° steps, e.g. for a landscape design on portrait paper.", "off": "Moves the artwork relative to the paper centre in mm: positive right/up. Drag the preview to adjust placement. Fit and Center may use nonzero offsets because they centre in the reachable portion of the sheet.", "mirror": "Mirrors the design horizontally (left and right swapped). Useful e.g. for tracing on the back of the paper.", "clip": "Clips all lines that extend beyond the paper edge (including the margin setting), so the pen never moves off the paper.\n\nIf the option is off, the program warns before saving if anything lies outside the paper.", "outline": "Traces the outlines of the filled (black/grey) shapes with the pen.\n\nTurn off if you only want the hatching.", "stroke": "Draws the stroke lines of the SVG as lines. The stroke width is ignored; the centre line is drawn.", "hatch": "Fills black and grey areas with parallel lines (hatching). The darker the area, the denser (only with \"Grey tones\" on).\n\nWhite-filled shapes are left out of the hatching. Without this option only outlines and lines are drawn.", "spacing": "Distance between two hatch lines (or two contour lines with contour fill) in mm. Smaller = denser and darker, but much longer drawing time.\n\nWith contour fill choose roughly the pen width (0.3 to 0.4 mm) so the area is filled solid.\n\nAbout 2 to 3 times the stroke width works well (fineliner 0.3 to 0.5 mm: 0.8 to 1.5 mm; pencil: 0.6 to 1.2 mm).", "angle": "Direction of the hatching in degrees relative to the paper (0° = horizontal, 90° = vertical). Independent of the design's rotation.", "cross": "Draws the darkest areas a second time in a second direction (+90°). This creates cross-hatching and makes the area darker.", "inset": "Makes the hatch lines stop this distance (mm) before the edge of the area, so the hatch stroke doesn't stick out over the outline. About half the stroke width is a good value. 0 = up to the edge.", "grey": "Represents grey tones of the fill through the line spacing: dark areas are fully hatched, lighter greys with every 2nd, 3rd or 4th line.\n\nWithout this option all non-white fills are hatched at the same density. Very light greys are hatched only lightly.", "simp": "Smooths and simplifies the contour lines. A higher value (e.g. 0.2 mm) gives fewer points and a calmer, faster drawing, but loses fine detail. For the highest quality 0.03 to 0.1 mm. 0 = off.", "minlen": "Lines shorter than this value are left out. This removes dots and noise that would only make the pen go up and down needlessly.", "profile": "Sets drawing speed, acceleration and landing speed to quality-oriented starting values.\n\nFineliner: 20 mm/s, 800 mm/s².\nPencil: even slower (15 mm/s, 500 mm/s²), so the lead doesn't break or judder.\n\nAs soon as you change one of the three values, the selection switches to \"Custom values\".", "zup": "Z height at which the pen hovers safely above the paper (travel height). Recommended: touch height + 3 to 5 mm.\n\nHigher = safer, but every line takes a little longer.", "zdown": "THE MOST IMPORTANT VALUE!\n\nZ height at which the pen writes. On the Bambu printer Z = 0 is the position at which the nozzle touches the bed. If the pen sticks out e.g. 3 mm, the touch height is about 3.1 mm.\n\nHow to find it: home the printer, put the paper down, move the head over the middle of the paper, lower Z in 1 mm and finally 0.1 mm steps until the pen tip just touches the paper. Enter this value (with a spring-loaded holder 0.3 to 0.5 mm less for light pressure).\n\nAlways approach from above and check with a test stroke first. Too low pushes the pen against the bed!", "fdraw": "Drawing speed in mm/min (1200 = 20 mm/s). Slower = cleaner lines, less vibration.\n\nFor the highest quality: fineliner 900 to 1500, pencil 600 to 1000. If you see waves in circles or at corners, lower it further.", "accel": "Acceleration in mm/s² (sent to the printer as M204 S…). Bambu printers accelerate very hard by default, which makes lines ring at corners and curves.\n\nLow (500 to 1000) = calm, clean lines. 0 = don't send.\n\nThe printer may limit or replace the value depending on the speed profile (Silent/Standard/Sport).", "ftravel": "Speed of travel moves with the pen raised, in mm/min (6000 = 100 mm/s). This can be faster. If the paper or print head shakes a lot, lower it to 4000.", "fz": "Speed of the pen's up and down movement in mm/min. Applies to raising and to the fast part of lowering. The last millimetre before the paper runs at \"Slow landing\".", "fland": "Speed of the last 1 mm of the lowering movement before the paper, in mm/min. Setting down slowly prevents ink blobs (fineliner), broken leads (pencil) and impact marks at the start of the stroke.", "home": "Adds G28 (homing) at the start so the printer knows its position.\n\nThe pen holder must NOT be mounted yet during homing. That's what the \"Two files\" option is for: Part 1 only does the homing, Part 2 draws.", "style": "Outline draws contours and SVG stroke centre lines. Hatched adds parallel lines. Contour fill follows boundaries. Stipple uses short 0.06 mm marks; keep Minimum path below 0.06 mm. Wavy hatch adds curved fill lines. Each layer/colour can override style and spacing. Standard G-code uses one pen; Export colour passes creates ordered manual-change passes.", "pause": "The pen holder must not be mounted during homing. That's why two files are generated:\n\nPart 1 (_Part1_Homing.gcode) only does the homing. Then the bed moves 50 mm further down (Z down + 50 mm) so you have room for the pen holder. The head stays put in XY, then the job ends.\nThen you attach the pen holder without hurrying.\nYou start Part 2 (_Part2_Draw.gcode) yourself when you're ready. It contains no homing, first moves Z to \"pen up\" and only then starts moving in XY.\n\nThis way you decide how long the pause lasts, and the head doesn't move to the purge chute (unlike a pause with M400 U1). Important: don't switch the printer off between Part 1 and Part 2 and don't disable the motors, otherwise the position is lost.", "sim": "Plays the drawing as an animation, in the order and with the speeds from the settings. A red ring shows the head: filled = pen down, empty = travel move. Drawing is shown in the colour of the line.\n\nStart simulation / Pause / Resume: stop and continue playback. Use the slider to jump to any point. Speed: the simulation runs faster than real time (e.g. 60× = one minute of drawing in one second). End: back to the normal view with the finished drawing.\n\nThis lets you spot detours, unnecessary travel moves and the order of the lines before you start the printer. If a setting changes, everything is recalculated and the simulation starts over. The time is an estimate like the duration in the info box; the real printer may be a bit slower.", "knife": "Blade offset: distance between the swivel axis of the blade holder and the blade tip. The tip trails behind the axis (the print head). Typical values are 0.25 to 0.6 mm, usually more for blades with a larger angle (e.g. 60°). You can get the exact value from the blade's dealer or manufacturer, or measure it.\n\nToo small: corners get rounded. Too large: corners overshoot. Check with a test cut (small square) and adjust in small steps.", "cornerang": "Corner angle: from this change of direction on, the head moves in a small arc around the corner so the blade rotates and the corner comes out clean. Smaller angles (curves) are cut without an arc.\n\nDefault 25°.", "overcut": "Overcut: closed contours start on a straight edge and run a little past the starting point at the end. This makes sure the contour is cut all the way through and no bridge is left. 0.5 to 2 mm is usual.\n\nContours never start in a corner, but in the middle of their longest edge.", "zup_cut": "Height of the blade while moving (raised). The blade tip must be well above the material, normally 3 to 5 mm above “Z blade down”.\n\nCaution: too low, and the blade drags across the material while moving.", "zdown_cut": "Height of the blade holder while cutting. It sets the cutting depth: the film should be cut all the way through, the backing paper underneath should not (kiss cut).\n\nApproach from above in 0.05 mm steps and check with a small test cut. Too low: the blade cuts through the backing paper, goes into the mat or damages the build plate.\n\nThe rigid blade holder does not compensate for height differences. The material must lie flat.", "profile_cut": "Starting values for speed, acceleration and slow landing of the blade.\n\nVinyl film: 25 mm/s, 500 mm/s². Paper / thin film: 20 mm/s, 400 mm/s². Landing is especially slow so the blade doesn't jump into the material.\n\nThese are only starting values. Slower usually cuts cleaner. Do a small test cut first. As soon as you change one of the values, the selection switches to “Custom values”.", "fdraw_cut": "Cutting speed in mm/min (1500 mm/min = 25 mm/s). Too fast: the blade vibrates, corners and curves become inaccurate, the material may slip. When in doubt, go slower."}, "guide": "HOMELAB-PLOTTER QUICK GUIDE\n\n1. Load SVG, open a saved .plotter.json project, create single-stroke text, or import PNG/JPG under Text and images.\n2. Enter physical plate size, paper size and paper bottom-left coordinates. Put the paper in that measured position.\n3. Set the holder XY offset and the independent nozzle travel limits under Head travel limits. The grey region is calculated from these settings; it is not a measurement of your printer.\n4. Select and order layers/colours. Choose a global fill style or override it per group. Fit and Center preserve paper coordinates.\n5. Set pen down/up for your physical pen adjustment. Defaults 14/25 mm are initial values for the project setup, not a calibration.\n6. Standard export draws all selected paths using one pen. Export colour passes offers Homing once and ordered drawing files for manual pen changes. Run Homing without the holder, then attach the adjusted holder and run Draw. Do not move the paper between passes.\n7. Save project preserves artwork, placement and current settings. SVG, images and projects are processed locally.\n\nText and images, Path quality and Head travel limits are expandable panels. Preview width shows the nib thickness without changing G-code. Joining nearby endpoints adds short inked connecting lines and is disabled at 0.\n\nSVG support is not a complete browser renderer: convert text, masks and effects to paths when needed and check the result. Full guide: https://github.com/spagno-lab/homelab-plotter/blob/main/GUIDE.md\n\nOriginal project instructions follow:\n\nGUIDE - STIFTPLOTTER (PEN PLOTTER)\n==================================\n\nNext to almost every value there is a small \"?\" with an explanation.\n\n1. PREPARE THE HARDWARE\n- Attach the pen to the print head, ideally with a holder that guides the pen with spring travel in Z (especially important for pencils).\n- The pen tip must sit a few millimetres lower than the nozzle tip.\n- Fix the paper with masking tape or magnets. It must lie flat and must not slip.\n- Nozzle and bed stay cold; the G-code contains no heating commands.\n\n2. FIND THE Z HEIGHT\n- On the Bambu printer Z = 0 is the position at which the nozzle touches the bed. If the pen sticks out e.g. 3 mm, it touches the paper at about Z = 3.1 mm (3 mm + approx. 0.1 mm paper).\n- Home the printer, put the paper down, move the head over the middle of the paper.\n- Lower Z in 1 mm steps, finally in 0.1 mm steps, until the pen tip just touches the paper. Note this value.\n- \"Z pen down\" = touch height (with a spring-loaded holder 0.3 to 0.5 mm less for light pressure).\n- \"Z pen up\" = touch height + 3 to 5 mm.\n- Always approach from above, never go too low.\n\n3. CHECK THE SETTINGS\n- Enter the bed and paper size and the position of the bottom-left paper corner.\n- Choose the pen profile (fineliner or pencil).\n- To test, first draw a small, simple SVG (e.g. a square and a circle).\n- If the pen doesn't draw: lower \"Z pen down\" in 0.2 mm steps. If it presses or scratches: raise it.\n- Waves at corners and circles mean vibration: lower the drawing speed and acceleration further.\n- If the drawing isn't where you expect, correct the paper corner (X, Y).\n\n4. LOAD AND PLACE THE DESIGN\n- \"Load SVG …\" (or drag the file into the window). The design is automatically fitted to the paper.\n- Set width, rotation, offset and mirroring. In the preview the design can be moved with the mouse. The blue dashed line shows the design's frame.\n- Choose the drawing mode: outline only, hatched (angle, line spacing, cross-hatching) or contour fill (lines follow the edge inwards, line spacing about the pen width; usually the best choice for text).\n- \"Change thickness\": makes filled shapes thicker or thinner (contour outwards/inwards), and stroke lines thicker (extra lines next to the line).\n\nTEXT AS A SINGLE LINE (INKSCAPE)\nNormal fonts are drawn as an outline (two lines per stroke). For a single line per stroke you need single-line fonts. Inkscape includes them from version 1.0:\n1. In Inkscape click on the canvas with the Text tool (T) and type the text. Font and size don't matter; you set the size here via \"Width\".\n2. Click the text with the Selector tool (arrow) so it is selected.\n3. Open Extensions > Text > Hershey Text …\n4. In the dialog choose a single-line font (e.g. a simple sans font with \"1-stroke\", or a script font). Turn on live preview if available, then Apply and Close.\n5. Delete the original text if it is still there. Only the single-line text remains.\n6. Save via File > Save As … as SVG (Inkscape SVG or Plain SVG).\n7. Here: \"Load SVG …\". The drawing mode doesn't matter for single-line text.\n\nSIMULATION\n- Below the preview: \"Start simulation\" plays back the drawing (selectable speed, slider to jump). A red ring shows the head. \"End\" shows the finished drawing again.\n\n5. SAVE THE G-CODE AND PRINT\n- The two Z heights are right above the save button. After clicking \"Save G-code …\" the program explicitly asks once more whether \"Z pen up\" and \"Z pen down\" are correct. It only continues after \"Yes\".\n- Then transfer the file to the printer.\n- With \"Two files\" you get Part 1 (homing only) and Part 2 (drawing). Start Part 1, then attach the pen holder, then start Part 2 when you're ready.\n- On the first real run stay next to the printer, finger on the stop button.\n\nCAUTION\n- The pen holder must not be mounted yet during homing (G28). So start Part 1 (homing only) first, then attach the holder and start Part 2. Whether the X2D keeps its position between jobs has not been tested.\n- On printers with two nozzles the unused nozzle must not drag over the paper or the pen.\n- It's not certain that your printer accepts a raw .gcode file. If the file is rejected, a .gcode.3mf from Bambu Studio is needed.\n- Set a calm speed profile on the printer (Silent or Standard). A higher profile can override the values in the G-code.\n", "guideCut": "CUTTING GUIDE (DRAG KNIFE)\n==========================\n\nIn cutting mode only the contours of the SVG are cut (no fill, no hatching). Holes, e.g. in letters like O or A, are cut too. Inner contours come first, the outer edge last, so the part stays held as long as possible.\n\nNext to almost every value there is a small \"?\" with an explanation.\n\n1. PREPARE THE HARDWARE\n- Insert the blade into the blade holder. The blade should only protrude a little; for thin film only slightly more than the film thickness (knurled cap on the holder, follow the manufacturer's instructions).\n- Attach the blade holder to the print head. It must sit firmly and must not wobble.\n- Lay the material (e.g. sticker film on backing paper) flat and non-slip on a cutting mat or sacrificial board and fix it with masking tape. The build plate must be protected.\n- Nozzle and bed stay cold; the G-code contains no heating commands.\n- Careful, the blade is sharp. Don't touch the tip when installing and adjusting it.\n\n2. FIND THE Z HEIGHT\n- On the Bambu printer Z = 0 is the position at which the nozzle touches the bed. Depending on the holder, the blade tip is a few millimetres lower.\n- Home the printer, put the material down, move the head over the material.\n- Lower from above in 1 mm steps, finally in 0.05 mm steps, until the blade just touches the material. Never go too low.\n- \"Z blade down\" = height at which the film is cut all the way through but the backing paper is not (kiss cut). You can only find it with test cuts.\n- \"Z blade up\" = touch height + 3 to 5 mm.\n\n3. TEST CUT\n- First cut a small square (e.g. 20 x 20 mm) and a small circle, ideally on a scrap piece.\n- Film not cut through: lower Z in 0.05 mm steps. Backing paper cut through or deeply scored: raise Z.\n- Corners rounded or overshooting: adjust the blade offset (distance from the swivel axis to the blade tip, typically 0.25 to 0.6 mm).\n- Contour not fully closed: increase the overcut.\n- Material slips or blade vibrates: lower speed and acceleration.\n\n4. LOAD AND PLACE THE DESIGN\n- \"Load SVG …\" (or drag the file into the window). The design is automatically fitted to the material.\n- Convert text and shapes to paths in Inkscape first (Path > Object to Path). Single-line fonts (Hershey) are unsuitable for cutting because they are only lines without an outline.\n- Only shapes with an outline or dark fill are cut. Light or white shapes (e.g. a white star on a black disc) count as cut-outs and are NOT cut. If you want a hole there, create a real hole in Inkscape (Path > Difference).\n- Set width, rotation, offset and mirroring. In the preview the design can be moved with the mouse. The simulation shows the head's path. The small arcs at corners and the overcut are intentional.\n- Paper size and position stand for the piece of material (sticker sheet). The margin limits the cutting area.\n\n5. SAVE THE G-CODE AND CUT\n- The two Z heights are right above the save button. After clicking \"Save cutting G-code …\" the program first asks about the Z heights and then for a safety check. It only continues after \"Yes\".\n- Part 1 (homing only) is started WITHOUT the blade holder. Then attach the blade holder and start Part 2 (cutting).\n- On the first run stay next to the printer, hand on the stop button.\n\nCAUTION\n- Everything at your own risk. Cutting with a 3D printer is a non-intended use and can damage the printer, build plate, blade and material.\n- A wrong Z value can drive the blade into the bed. Always approach from above.\n- The blade holder is rigid and does not compensate for height differences. Only cut thin material that lies flat (film, paper). Don't cut thick or hard material.\n- Lateral forces put strain on the print head. Choose low speed and acceleration.\n- Keep your hands out of the working area while the printer is running.\n- It's not certain that your printer accepts a raw .gcode file. If the file is rejected, a .gcode.3mf from Bambu Studio is needed.\n"}</script>
<script type="text/plain" id="engine-src">"use strict";
/* Calculation core: geometry, offset, hatching, contour fill, ordering, G-code.
   Runs in the web worker and in the main thread (identical code). Points are {x, y}, all dimensions in mm. */
var Engine = (function () {
  var JoinTol = 0.02;

  function roundEven(v) {            // like .NET Math.Round (round half to even)
    var f = Math.floor(v), d = v - f;
    if (d < 0.5) return f;
    if (d > 0.5) return f + 1;
    return (f % 2 === 0) ? f : f + 1;
  }

  // ------------------------------------------------------------------ Geo
  function dist(a, b) { var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
  function length(p) { var s = 0; for (var i = 1; i < p.length; i++) s += dist(p[i - 1], p[i]); return s; }

  /** Douglas-Peucker */
  function simplify(pts, eps) {
    if (pts.length < 3 || eps <= 0) return pts;
    var keep = new Array(pts.length); for (var k = 0; k < keep.length; k++) keep[k] = false;
    keep[0] = true; keep[pts.length - 1] = true;
    var st = [[0, pts.length - 1]];
    while (st.length > 0) {
      var ab = st.pop(), a = ab[0], b = ab[1];
      var md = 0, mi = -1;
      var ax = pts[a].x, ay = pts[a].y;
      var dx = pts[b].x - ax, dy = pts[b].y - ay;
      var l2 = dx * dx + dy * dy;
      for (var i = a + 1; i < b; i++) {
        var px = pts[i].x, py = pts[i].y, d;
        if (l2 === 0) {
          d = Math.sqrt((px - ax) * (px - ax) + (py - ay) * (py - ay));
        } else {
          var t = ((px - ax) * dx + (py - ay) * dy) / l2;
          if (t < 0) t = 0; else if (t > 1) t = 1;
          var qx = ax + t * dx - px, qy = ay + t * dy - py;
          d = Math.sqrt(qx * qx + qy * qy);
        }
        if (d > md) { md = d; mi = i; }
      }
      if (md > eps && mi > 0) { keep[mi] = true; st.push([a, mi]); st.push([mi, b]); }
    }
    var r = [];
    for (var j = 0; j < pts.length; j++) if (keep[j]) r.push(pts[j]);
    return r;
  }

  /** Liang-Barsky */
  function clipSeg(a, b, x0, y0, x1, y1) {
    var t0 = 0, t1 = 1, dx = b.x - a.x, dy = b.y - a.y;
    var P = [-dx, dx, -dy, dy];
    var Q = [a.x - x0, x1 - a.x, a.y - y0, y1 - a.y];
    for (var i = 0; i < 4; i++) {
      if (P[i] === 0) {
        if (Q[i] < 0) return null;
      } else {
        var t = Q[i] / P[i];
        if (P[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; }
        else { if (t < t0) return null; if (t < t1) t1 = t; }
      }
    }
    return {
      pa: { x: a.x + t0 * dx, y: a.y + t0 * dy },
      pb: { x: a.x + t1 * dx, y: a.y + t1 * dy },
      startKept: t0 === 0, endKept: t1 === 1
    };
  }

  function clipRect(p, x0, y0, x1, y1, output) {
    var cur = null;
    for (var i = 1; i < p.length; i++) {
      var c = clipSeg(p[i - 1], p[i], x0, y0, x1, y1);
      if (c === null) {
        if (cur !== null) { flush(cur, output); cur = null; }
        continue;
      }
      if (cur === null) { cur = [c.pa]; }
      else if (!c.startKept) { flush(cur, output); cur = [c.pa]; }
      cur.push(c.pb);
      if (!c.endKept) { flush(cur, output); cur = null; }
    }
    if (cur !== null) flush(cur, output);
  }
  function flush(cur, output) { if (cur.length >= 2) output.push(cur); }

  // ------------------------------------------------------------------ Offset
  var OffPitch = 0.35;
  var MinDen = 2.0 / 9.0;

  function dedupe(p, closed) {
    var r = [];
    for (var i = 0; i < p.length; i++) {
      var q = p[i];
      if (r.length === 0 || dist(r[r.length - 1], q) > 1e-6) r.push(q);
    }
    if (closed && r.length > 1 && dist(r[0], r[r.length - 1]) <= 1e-6) r.pop();
    return r;
  }

  /** Offset a line sideways. sgn = +1 left of the direction of travel, -1 right. */
  function offLine(src, closed, d, sgn) {
    var p = dedupe(src, closed);
    var n = p.length;
    if (n < 2) return src;
    var ne = closed ? n : n - 1;
    var nx = new Array(ne), ny = new Array(ne);
    for (var i = 0; i < ne; i++) {
      var a = p[i], b = p[(i + 1) % n];
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy);
      nx[i] = sgn * (-dy / len);
      ny[i] = sgn * (dx / len);
    }
    var r = new Array(n);
    for (var j = 0; j < n; j++) {
      var e0, e1, h0, h1;
      if (closed) { e0 = (j - 1 + n) % n; e1 = j; h0 = true; h1 = true; }
      else { e0 = j - 1; e1 = j; h0 = e0 >= 0; h1 = e1 < ne; }
      var ox, oy;
      if (h0 && h1) {
        var mx = nx[e0] + nx[e1], my = ny[e0] + ny[e1];
        var den = 1.0 + nx[e0] * nx[e1] + ny[e0] * ny[e1];
        if (den >= MinDen) { ox = mx / den; oy = my / den; }
        else {
          var ml = Math.sqrt(mx * mx + my * my);
          if (ml < 1e-9) { ox = nx[e0]; oy = ny[e0]; }
          else { ox = mx / ml; oy = my / ml; }
        }
      } else if (h0) { ox = nx[e0]; oy = ny[e0]; }
      else { ox = nx[e1]; oy = ny[e1]; }
      r[j] = { x: p[j].x + d * ox, y: p[j].y + d * oy };
    }
    return r;
  }

  function inside(polys, evenOdd, x, y) {
    var wind = 0, cross = 0;
    for (var k = 0; k < polys.length; k++) {
      var p = polys[k], n = p.length;
      if (n < 3) continue;
      for (var i = 0, j = n - 1; i < n; j = i++) {
        var yi = p[i].y, yj = p[j].y;
        if ((yi > y) !== (yj > y)) {
          var xi = p[i].x + (y - yi) * (p[j].x - p[i].x) / (yj - yi);
          if (xi > x) { cross++; wind += (yj > yi) ? 1 : -1; }
        }
      }
    }
    return evenOdd ? (cross & 1) === 1 : wind !== 0;
  }

  /** Offset all contours of a filled shape: d > 0 grows, d < 0 shrinks. */
  function offShape(polys, evenOdd, d) {
    var res = [];
    for (var k = 0; k < polys.length; k++) {
      var src = polys[k];
      var p = dedupe(src, true), n = p.length;
      if (n < 3) { res.push(src); continue; }
      var best = 0, bl = -1;
      for (var i = 0; i < n; i++) {
        var l = dist(p[i], p[(i + 1) % n]);
        if (l > bl) { bl = l; best = i; }
      }
      var a = p[best], b = p[(best + 1) % n];
      var dx = b.x - a.x, dy = b.y - a.y;
      var lenE = Math.sqrt(dx * dx + dy * dy);
      var lx = -dy / lenE, ly = dx / lenE;
      var tx = 0.5 * (a.x + b.x) + lx * 0.02, ty = 0.5 * (a.y + b.y) + ly * 0.02;
      var leftInside = inside(polys, evenOdd, tx, ty);
      var sgn = leftInside ? -1 : 1;
      res.push(offLine(p, true, d, sgn));
    }
    return res;
  }

  /** Thicken a stroke line: extra lines left and right at distance OffPitch. */
  function thicken(q, closed, thick, simp, outList) {
    var k = roundEven(thick / OffPitch);
    if (k < 1) k = 1;
    if (k > 12) k = 12;
    for (var s = 1; s <= k; s++)
      for (var side = -1; side <= 1; side += 2) {
        var o = offLine(q, closed, s * OffPitch, side);
        if (closed && o.length >= 3) { o = o.slice(); o.push(o[0]); }
        o = simplify(o, simp);
        if (o.length >= 2) outList.push(o);
      }
  }

  // ------------------------------------------------------------------ Contour fill
  var MinPocket = 0.6;

  function Boundary(cell) {
    this.cell = cell;
    this.segs = [];
    this.grid = new Map();
  }
  Boundary.key = function (cx, cy) { return cx * 4194304 + cy; };
  Boundary.prototype.addPolygon = function (p) { this.addPolyline(p, true); };
  Boundary.prototype.addPolyline = function (p, closed) {
    var n = p.length;
    if (n < 2) return;
    var ne = closed ? n : n - 1;
    for (var i = 0; i < ne; i++) {
      var a = p[i], b = p[(i + 1) % n];
      this.addSegment(a.x, a.y, b.x, b.y, 0);
    }
  };
  Boundary.prototype.addSegment = function (x1, y1, x2, y2, depth) {
    var cell = this.cell;
    var cx0 = Math.floor(Math.min(x1, x2) / cell), cx1 = Math.floor(Math.max(x1, x2) / cell);
    var cy0 = Math.floor(Math.min(y1, y2) / cell), cy1 = Math.floor(Math.max(y1, y2) / cell);
    var cells = (cx1 - cx0 + 1) * (cy1 - cy0 + 1);
    if (cells > 16 && depth < 20) {
      var mx = 0.5 * (x1 + x2), my = 0.5 * (y1 + y2);
      this.addSegment(x1, y1, mx, my, depth + 1);
      this.addSegment(mx, my, x2, y2, depth + 1);
      return;
    }
    var id = this.segs.length;
    this.segs.push([x1, y1, x2, y2]);
    for (var cx = cx0; cx <= cx1; cx++)
      for (var cy = cy0; cy <= cy1; cy++) {
        var k = Boundary.key(cx, cy), l = this.grid.get(k);
        if (l === undefined) { l = []; this.grid.set(k, l); }
        l.push(id);
      }
  };
  var _qx = 0, _qy = 0;
  function closest(s, x, y) {
    var dx = s[2] - s[0], dy = s[3] - s[1];
    var len2 = dx * dx + dy * dy;
    var t = len2 < 1e-18 ? 0 : ((x - s[0]) * dx + (y - s[1]) * dy) / len2;
    if (t < 0) t = 0; else if (t > 1) t = 1;
    _qx = s[0] + t * dx;
    _qy = s[1] + t * dy;
    var ex = _qx - x, ey = _qy - y;
    return ex * ex + ey * ey;
  }
  /** true if any segment lies closer than r to the point. */
  Boundary.prototype.closer = function (x, y, r) {
    var cell = this.cell;
    var cx0 = Math.floor((x - r) / cell), cx1 = Math.floor((x + r) / cell);
    var cy0 = Math.floor((y - r) / cell), cy1 = Math.floor((y + r) / cell);
    var r2 = r * r;
    for (var cx = cx0; cx <= cx1; cx++)
      for (var cy = cy0; cy <= cy1; cy++) {
        var l = this.grid.get(Boundary.key(cx, cy));
        if (l === undefined) continue;
        for (var i = 0; i < l.length; i++) {
          if (closest(this.segs[l[i]], x, y) < r2) return true;
        }
      }
    return false;
  };
  /** Nearest edge point within r; with hasDir only points in the opposite direction to (ux, uy). */
  Boundary.prototype.nearest = function (x, y, r, hasDir, ux, uy) {
    var cell = this.cell;
    var cx0 = Math.floor((x - r) / cell), cx1 = Math.floor((x + r) / cell);
    var cy0 = Math.floor((y - r) / cell), cy1 = Math.floor((y + r) / cell);
    var best = r * r, found = false, qxo = 0, qyo = 0;
    for (var cx = cx0; cx <= cx1; cx++)
      for (var cy = cy0; cy <= cy1; cy++) {
        var l = this.grid.get(Boundary.key(cx, cy));
        if (l === undefined) continue;
        for (var i = 0; i < l.length; i++) {
          var d2 = closest(this.segs[l[i]], x, y);
          if (d2 >= best) continue;
          if (hasDir) {
            var d = Math.sqrt(d2);
            if ((_qx - x) * ux + (_qy - y) * uy >= -0.2 * d) continue;
          }
          best = d2; found = true; qxo = _qx; qyo = _qy;
        }
      }
    if (!found) return null;
    return { x: qxo, y: qyo, dist: Math.sqrt(best) };
  };

  function contourRun(shapes, spacing, simp, outList) {
    for (var i = 0; i < shapes.length; i++) {
      var black = shapes[i];
      if (black.erase) continue;
      var whites = [];
      for (var j = i + 1; j < shapes.length; j++) if (shapes[j].erase) whites.push(shapes[j]);
      fillShape(black, whites, spacing * Math.max(1, black.step), simp, outList);
    }
  }

  function fillShape(black, whites, pitch, simp, outList) {
    var cell = Math.max(0.6, pitch * 2.0);
    var bd = new Boundary(cell);
    var drawn = new Boundary(cell);
    var k, i, j;
    for (i = 0; i < black.polys.length; i++) { bd.addPolygon(black.polys[i]); drawn.addPolygon(black.polys[i]); }
    for (i = 0; i < whites.length; i++) for (j = 0; j < whites[i].polys.length; j++) bd.addPolygon(whites[i].polys[j]);

    // ---- 1. Rings inwards
    var levels = [];
    for (k = 0; k <= 400; k++) {
      var de = k === 0 ? 0.05 * pitch : k * pitch;
      var lv = { D: de, pieces: [] };
      var emit = [];
      var loops = offShape(black.polys, black.evenOdd, -de);
      for (i = 0; i < loops.length; i++)
        pieces(loops[i], de, pitch, black, whites, -1, bd, lv.pieces, k > 0 ? emit : null);
      for (var wi = 0; wi < whites.length; wi++) {
        var w = whites[wi];
        var wl = offShape(w.polys, w.evenOdd, de);
        for (i = 0; i < wl.length; i++)
          pieces(wl[i], de, pitch, black, whites, wi, bd, lv.pieces, emit);
      }
      for (i = 0; i < emit.length; i++) {
        var sp = simplify(emit[i], simp);
        if (sp.length < 2) continue;
        outList.push(sp);
        drawn.addPolyline(sp, false);
      }
      if (k > 0 && lv.pieces.length === 0) break;
      levels.push(lv);
    }

    // ---- 2. Centre lines in narrow strips
    var centers = new Boundary(cell);
    for (var li = 0; li < levels.length; li++) {
      var lev = levels[li];
      var next = null;
      if (li + 1 < levels.length) {
        next = new Boundary(cell);
        for (i = 0; i < levels[li + 1].pieces.length; i++) next.addPolyline(levels[li + 1].pieces[i], false);
      }
      for (var pi = 0; pi < lev.pieces.length; pi++) {
        var pc = lev.pieces[pi];
        var cur = [];
        for (var vi = 0; vi < pc.length; vi++) {
          var v = pc[vi];
          var has = false, m = null;
          var frontier = next === null || !next.closer(v.x, v.y, 1.6 * pitch);
          if (frontier) {
            var q1 = bd.nearest(v.x, v.y, lev.D * 1.5 + 2.0 * pitch, false, 0, 0);
            if (q1 !== null && q1.dist > 1e-9) {
              var ux = (q1.x - v.x) / q1.dist, uy = (q1.y - v.y) / q1.dist;
              var q2 = bd.nearest(v.x, v.y, q1.dist + 3.0 * pitch, true, ux, uy);
              if (q2 !== null && q2.dist - q1.dist > 0.9 * pitch) {
                m = { x: 0.5 * (q1.x + q2.x), y: 0.5 * (q1.y + q2.y) };
                has = !centers.closer(m.x, m.y, 0.45 * pitch);
              }
            }
          }
          if (has) cur.push(m);
          else cur = flushCenter(cur, pitch, simp, centers, drawn, outList);
        }
        flushCenter(cur, pitch, simp, centers, drawn, outList);
      }
    }

    // ---- 3. Leftover pockets
    fillPockets(black, whites, pitch, drawn, outList);
  }

  function flushCenter(cur, pitch, simp, centers, drawn, outList) {
    if (cur.length >= 2) {
      if (length(cur) >= Math.max(1.5 * pitch, MinPocket)) {
        var sp = simplify(cur, simp);
        if (sp.length >= 2) {
          outList.push(sp);
          centers.addPolyline(cur, false);
          drawn.addPolyline(sp, false);
        }
      }
    }
    return [];
  }

  /** Collect valid parts of an offset contour as dense line pieces. */
  function pieces(loop, d, pitch, black, whites, own, bd, all, emit) {
    var n = loop.length;
    if (n < 3) return;
    var ok = new Array(n);
    var cnt = 0;
    var r = d * 0.97;
    for (var i = 0; i < n; i++) {
      var v = loop[i];
      var good = true;
      if (own >= 0) good = inside(black.polys, black.evenOdd, v.x, v.y);
      if (good)
        for (var w = 0; w < whites.length; w++) {
          if (inside(whites[w].polys, whites[w].evenOdd, v.x, v.y)) { good = false; break; }
        }
      if (good && bd.closer(v.x, v.y, r)) good = false;
      ok[i] = good;
      if (good) cnt++;
    }
    if (cnt === 0) return;
    if (cnt === n) {
      var t = loop.slice(); t.push(t[0]);
      all.push(t);
      if (emit !== null) emit.push(t);
      return;
    }
    var start = 0;
    while (ok[start]) start++;
    var run = [];
    for (var s = 1; s <= n; s++) {
      var idx = (start + s) % n;
      if (ok[idx]) run.push(loop[idx]);
      else {
        if (run.length >= 2) {
          if (length(run) >= 2.0 * pitch) {
            all.push(run);
            if (emit !== null) emit.push(run);
          }
        }
        run = [];
      }
    }
  }

  function fillPockets(black, whites, pitch, drawn, outList) {
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    var i, j;
    for (i = 0; i < black.polys.length; i++)
      for (j = 0; j < black.polys[i].length; j++) {

function makeNum(min, max, dec, inc, val, key) {

  cut:  { zup: 15, zdown: 10, fdraw: 1500, accel: 500, ftravel: 6000, fz: 1200, fland: 300, profile: 0, home: true, pause: true }
};

function readStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null") || {}; } catch (e) { return {}; }
}
function loadSettings() {
  var o = readStore();
  for (var k in fields) {
    var kk = MODEKEYS[k] ? mode + "." + k : k;
    if (!(kk in o)) {
      if (mode === "draw" && MODEKEYS[k] && (k in o)) kk = k;   // old storage format without mode
      else continue;
    }
    var f = fields[k], v = o[kk];
    if (f.kind === "num") { if (typeof v === "number" && isFinite(v)) f.set(v); }
    else if (f.kind === "chk") f.set(v === 1 || v === true);
    else if (f.kind === "sel") { if (typeof v === "number") f.set(v); }
  }
}
var saveTimer = null;
function saveSettings() {
  if (!modeChosen) return;
  var o = readStore();
  for (var k in fields) {
    var f = fields[k];
    var kk = MODEKEYS[k] ? mode + "." + k : k;
    o[kk] = f.kind === "num" ? f.get() : (f.kind === "chk" ? (f.get() ? 1 : 0) : f.get());
  }
  o.lastMode = mode;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch (e) { /* e.g. private mode: ignore */ }
}

function loadSvgText(text, fileName, keepImage) {
  try {
    var d = SvgLoader.load(text);
    sourceSvg=text;if(!keepImage)imageSource=null;
    initGroups(d);
    design = d;
    designName = fileName.replace(/\.[^.]*$/, "").replace(/[\\\/:*?"<>|]+/g, "_") || "Design";
    result = null; resultParams = null;
    simPause();
    prev.setResult(null, null);
    prev.setMessage("");
    updateSimUi();
    updating = true;
    U.offU.set(0); U.offV.set(0); U.rot.set(0);
    U.mirror.set(false);
    updating = false;
    U.lblSvg.textContent = fileName + "\nSize in SVG: " + fmt(d.w, 2) + " × " + fmt(d.h, 2) + " units\n" +
      d.fillCount + " fills · " + d.strokeCount + " stroke lines · " + d.eraseCount + " cut-outs";
    setStatus("SVG loaded: " + fileName + " (" + d.shapes.length + " shapes, " + d.pointCount + " points)");
    fitDesign();
    if (d.warnings.length > 0) info("Notes on the SVG file", d.warnings.join("\n\n"));
  } catch (ex) {
    info("Homelab-Plotter", "The SVG file could not be loaded:\n\n" + ex.message);

}
function loadFile(file) {
  if (!file) return;
  if(/\.plotter\.json$/i.test(file.name)){file.text().then(function(t){try{openProject(JSON.parse(t));}catch(e){info('Project',e.message);}});return;}
  if(/^image\/(png|jpeg)$/.test(file.type)){if(file.size>12000000)return info('Image','Choose a PNG/JPG smaller than 12 MB.');var ir=new FileReader();ir.onload=function(){imageSource=String(ir.result);convertImage();};ir.readAsDataURL(file);return;}
  if(file.size>8000000)return info('SVG','Choose an SVG smaller than 8 MB.');
  if (!/\.svg$/i.test(file.name) && file.type !== "image/svg+xml") {
    info("Homelab-Plotter", "Please choose an SVG file (.svg).");
    return;
  }
  var rd = new FileReader();
  rd.onload = function () { loadSvgText(String(rd.result), file.name); };
  rd.onerror = function () { info("Homelab-Plotter", "The file could not be read."); };

}

function rotate(delta) {

  while (r <= -180) r += 360;
  U.rot.set(r);
  paramChanged();
}
function centerDesign() {
  var p=readParams(), a=Engine.usablePaper(p,readMachine());

    return info("No usable paper area", "The paper margins and the reachable pen area do not overlap. Move the physical paper and update its coordinates, reduce the margins, or choose a smaller sheet.");

// ------------------------------------------------------------------ Calculation (web worker)
function workerUrlFor() {
  if (workerUrl) return workerUrl;
  var src = ENGINE_SRC + "\nonmessage=function(e){var d=e.data;try{postMessage({id:d.id,result:Engine.build(d.design,d.params)});}catch(x){postMessage({id:d.id,error:String(x&&x.message||x)});}};";
  workerUrl = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
  return workerUrl;
}
function startCompute() {
  if (!design) return;
  if (worker) { worker.terminate(); worker = null; }
  busy = true;
  var id = ++jobId, params = readParams(), d = design;
  setStatusQuiet("Calculating …");
  function done(res, err) {
    if (id !== jobId || d !== design) return;
    busy = false;
    if (worker) { worker.terminate(); worker = null; }
    if (err) { setStatus("Calculation error: " + err); return; }
    result = res; resultParams = params;
    simPause();
    prev.setMotion(params.fDraw, params.fTravel, Engine.zTime(params.zUp, params.zDown, params.fZ, params.fLand), params.accel);
    prev.pathColors=res.batches.flatMap(function(b){return b.paths.map(function(){return b.color;});});
    prev.setResult(res.paths, res.frame);
    updateSimUi();
    updateShift();
    updateInfo();
    setStatus("Calculated: " + res.paths.length + (isCut() ? " cuts, " : " lines, ") + fmt(res.drawLen / 1000.0, 2) + (isCut() ? " m cutting path." : " m drawing path."));
  }
  try {
    worker = new Worker(workerUrlFor());
    worker.onmessage = function (e) { done(e.data.result, e.data.error); };
    worker.onerror = function (e) { done(null, e.message || "Worker error"); };
    worker.postMessage({ id: id, design: d, params: params });
  } catch (ex) {
    // fallback without worker: calculate in the main thread
    setTimeout(function () {
      try { done(Engine.build(d, params), null); } catch (e2) { done(null, e2.message); }
    }, 10);
  }
}

function dur(sec) {
  var mins = Math.round(sec / 60.0);
  if (mins < 1) return "under 1 min";
  if (mins < 60) return mins + " min";
  return Math.floor(mins / 60) + " h " + (mins % 60) + " min";
}
function updateInfo() {
  var warn = [];

    var offsetWarning = Engine.toolheadError(result.paths, readMachine());
    if (offsetWarning) warn.push(offsetWarning);
  }
  if (U.zUp.get() <= U.zDown.get()) warn.push("“Z " + toolWord() + " up” must be greater than “Z " + toolWord() + " down”.");
  if (U.px.get() < 0 || U.py.get() < 0 || U.px.get() + U.paperW.get() > U.bedX.get() + 0.01 || U.py.get() + U.paperH.get() > U.bedY.get() + 0.01)
    warn.push("The paper extends beyond the print bed (red paper edge).");
  if (!design) U.lblInfo.textContent = "No design loaded yet.";
  else if (!result) U.lblInfo.textContent = "Calculating …";
  else {
    if (isCut())
      U.lblInfo.textContent = result.paths.length + " cuts (contours and lines)\n" +
        "Cutting path " + fmt(result.drawLen / 1000.0, 2) + " m · travel " + fmt(result.travelLen / 1000.0, 2) + " m · " + result.liftCount + " pen-downs\n" +
        "Duration at least approx. " + dur(result.seconds) + " (a bit longer in reality)";
    else
    U.lblInfo.textContent = result.paths.length + " lines (" + result.outlinePaths + " contours, " + result.hatchLines + " fill)\n" +
      "Drawing path " + fmt(result.drawLen / 1000.0, 2) + " m · travel " + fmt(result.travelLen / 1000.0, 2) + " m · " + result.liftCount + " pen-downs\n" +
      "Duration at least approx. " + dur(result.seconds) + " (a bit longer in reality)";
    if (result.paths.length === 0) warn.push(isCut() ? "No cuts were generated. The design lies outside the paper or contains no contours." : "No lines were generated. Check the drawing style, or the design lies outside the paper.");
    if (result.outsideBed) warn.push("Parts of the drawing lie outside the print bed.");
    if (result.outsidePaper) warn.push("Parts of the drawing lie outside the paper (enable clipping or make it smaller).");

      "Z " + toolWord() + " down:   " + fmt(m.zDown, 2) + " mm   (" + (isCut() ? "blade cuts the material" : "pen touches the paper") + ")\n\n" +

        "Please confirm:\n\n" +
        "• The blade holder with the blade is firmly seated, the blade only protrudes slightly.\n" +
        "• There is a cutting mat or sacrificial board under the material, the build plate is protected.\n" +
        "• The cutting depth has been checked with a test cut.\n" +
        "• I will stay at the printer while it cuts, with my hand on the stop button.\n\n" +
        "Is everything done?", true) : Promise.resolve(true);
      return pre.then(function (okPre) {
      if (!okPre) return;
      var p1 = res.outsideBed ? ask("Homelab-Plotter", "Parts of the drawing lie outside the print bed and will be clipped.\n\nSave anyway?", true) : Promise.resolve(true);
      return p1.then(function (ok3) {
        if (!ok3) return;
        var p2 = res.outsidePaper ? ask("Homelab-Plotter", "Parts of the drawing lie outside the paper. " + (isCut() ? "The blade would cut into the bed there." : "The pen would draw on the bed there.") + "\n\nSave anyway?", true) : Promise.resolve(true);
        return p2.then(function (ok4) {
          if (!ok4) return;
          writeFiles(res, m);
        });
      });
      });
    });
  });
}
function writeFiles(res, m) {
  var name = designName + (isCut() ? "_Cut" : "");
  var text = Engine.gcodeWrite(res.paths, m, name, VERSION);
  var homing = (m.home && m.pause) ? Engine.gcodeHoming(m, name, VERSION) : null;
  if (homing === null) {
    download(name + ".gcode", text);
    setStatus("G-code created: " + name + ".gcode");
    info("Homelab-Plotter", "G-code created:\n" + name + ".gcode\n\nThe browser saves the file to your Downloads folder.");
    return;
  }
  var f1 = name + "_Part1_Homing.gcode", f2 = name + (isCut() ? "_Part2_Cut.gcode" : "_Part2_Draw.gcode");
  download(f1, homing);
  setTimeout(function () { download(f2, text); }, 400);
  setStatus("G-code created: " + f1 + " and " + f2);
  dialog({
    title: "Homelab-Plotter",
    text: "Two files created:\n\n1) " + f1 + "\n2) " + f2 + "\n\n" +
      "Procedure: start Part 1 (homing, the bed moves down 50 mm, the head stays put in XY), still WITHOUT the " + holder() + ". Then attach the " + holder() + " and start Part 2 when you are ready.\n\n" +
      "If the browser asks whether multiple files may be downloaded, please allow it. If a file is missing, download it again here:",
    links: [{ label: f1 + " download", fn: function () { download(f1, homing); } }, { label: f2 + " download", fn: function () { download(f2, text); } }],
    buttons: [{ label: "OK", value: true, primary: true, focus: true }], cancelValue: true
  });
}

// ------------------------------------------------------------------ Preview
function Preview(canvas) {
  this.cv = canvas; this.ctx = canvas.getContext("2d");
  this.bedX = 260; this.bedY = 260; this.paperX = 20; this.paperY = 20; this.paperW = 148; this.paperH = 210; this.margin = 0;
  this.paths = null; this.frame = null; this.msg = "";
  this.sx = 0; this.sy = 0; this.dragX = 0; this.dragY = 0;
  this.simOn = false; this.simT = 0; this.tl = null;
  this.simPath = null; this.simIdx = 0; this.simPartial = null;
  this.lay = { s: 1, ox: 0, oy: 0 };
  var self = this, drag = null;
  canvas.addEventListener("pointerdown", function (e) {
    if (!self.paths || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    canvas.style.cursor = "grabbing";
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!drag) { canvas.style.cursor = self.paths ? "grab" : "default"; return; }
    self.dragX = (e.clientX - drag.x) / self.lay.s;
    self.dragY = -(e.clientY - drag.y) / self.lay.s;
    self.draw();
  });
  function end(e) {
    if (!drag) return;
    var dx = (e.clientX - drag.x) / self.lay.s, dy = -(e.clientY - drag.y) / self.lay.s;
    drag = null; self.dragX = 0; self.dragY = 0;
    canvas.style.cursor = "grab";
    if (Math.abs(dx) > 0.001 || Math.abs(dy) > 0.001) onPreviewDrag(Math.round(dx * 100) / 100, Math.round(dy * 100) / 100);
    else self.draw();
  }
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  window.addEventListener("resize", function () { self.draw(); });
  if (window.ResizeObserver) new ResizeObserver(function () { self.draw(); }).observe(canvas.parentNode);
}
Preview.prototype.setShift = function (dx, dy) { this.sx = dx; this.sy = dy; this.draw(); };
Preview.prototype.setMessage = function (m) { this.msg = m; this.draw(); };
Preview.prototype.setResult = function (paths, frame) {
  this.paths = paths; this.frame = frame; this.tl = null; this.simOn = false; this.simT = 0;
  this.simPath = null; this.simIdx = 0; this.simPartial = null;
  this.sx = 0; this.sy = 0;
  this.draw();
};
Preview.prototype.setMotion = function (fDraw, fTravel, zt, accel) { this.mot = { fDraw: fDraw, fTravel: fTravel, zt: zt, accel: accel }; };

// Simulation timeline (same logic as the time estimate)
Preview.prototype.timeline = function () {
  if (this.tl) return this.tl;
  var m = this.mot, P = this.paths, n = P.length;
  var vd = Math.max(1, m.fDraw) / 60, vt = Math.max(1, m.fTravel) / 60;
  var tl = { fromPt: [], tTravel: [], tDrawS: [], tDrawE: [], pLen: [], joined: [], total: 0 };
  var cur = { x: this.paperX, y: this.paperY }, down = false, t = 0;
  for (var i = 0; i < n; i++) {
    var p = P[i], d = Engine.dist(cur, p[0]);
    tl.fromPt.push(cur);
    var j = down && d < Engine.JoinTol;
    tl.joined.push(j);
    tl.tTravel.push(t);
    if (!j) { t += Engine.moveTime(d, vt, m.accel); t += m.zt; down = true; }
    tl.tDrawS.push(t);
    var len = Engine.length(p);
    tl.pLen.push(len);
    t += Engine.moveTime(len, vd, m.accel);
    tl.tDrawE.push(t);
    cur = p[p.length - 1];
  }
  tl.total = t; this.tl = tl;
  return tl;
};
// Simulation state at time t: { idx, partialPts, marker, down }
Preview.prototype.stateAt = function (t) {
  var tl = this.timeline(), n = this.paths.length;
  if (n === 0) return { idx: 0, part: null, mk: { x: this.paperX, y: this.paperY }, down: false };
  if (t >= tl.total) { var lp = this.paths[n - 1]; return { idx: n, part: null, mk: lp[lp.length - 1], down: true }; }
  var lo = 0, hi = n - 1;
  while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (tl.tTravel[mid] <= t) lo = mid; else hi = mid - 1; }
  var i = lo, p = this.paths[i];
  if (t < tl.tDrawS[i]) {
    var a = tl.fromPt[i], b = p[0], tt = tl.tDrawS[i] - this.mot.zt - tl.tTravel[i];
    var f = tt > 0 ? clamp((t - tl.tTravel[i]) / tt, 0, 1) : 1;
    return { idx: i, part: null, mk: { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f }, down: false };
  }
  var dur = tl.tDrawE[i] - tl.tDrawS[i], fr = dur > 0 ? clamp((t - tl.tDrawS[i]) / dur, 0, 1) : 1;
  var target = fr * tl.pLen[i], acc = 0, pts = [p[0]], mk = p[0];
  for (var k = 1; k < p.length; k++) {
    var sl = Engine.dist(p[k - 1], p[k]);
    if (acc + sl >= target) {
      var ff = sl > 0 ? (target - acc) / sl : 0;
      mk = { x: p[k - 1].x + (p[k].x - p[k - 1].x) * ff, y: p[k - 1].y + (p[k].y - p[k - 1].y) * ff };
      pts.push(mk); break;
    }
    acc += sl; pts.push(p[k]); mk = p[k];
  }
  return { idx: i, part: pts, mk: mk, down: true };
};
Preview.prototype.simSet = function (t) {
  var tl = this.timeline();
  this.simT = clamp(t, 0, tl.total);
  this.simOn = true;
  var st = this.stateAt(this.simT);
  if (!this.simPath || st.idx < this.simIdx) { this.simPath = new Path2D(); this.simIdx = 0; }
  for (; this.simIdx < st.idx; this.simIdx++) {
    var p = this.paths[this.simIdx];
    this.simPath.moveTo(p[0].x, p[0].y);
    for (var k = 1; k < p.length; k++) this.simPath.lineTo(p[k].x, p[k].y);
  }
  this.simPartial = st.part; this.simMk = st.mk; this.simDown = st.down;
  this.draw();
};
Preview.prototype.simOff = function () {
  this.simOn = false; this.simPath = null; this.simIdx = 0; this.simPartial = null; this.draw();
};

Preview.prototype.draw = function () {
  var cv = this.cv, par = cv.parentNode;
  var W = par.clientWidth, H = par.clientHeight, dpr = window.devicePixelRatio || 1;
  if (W < 10 || H < 10) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  var c = this.ctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  var pad = 14, s = Math.min((W - 2 * pad) / this.bedX, (H - 2 * pad) / this.bedY);
  if (!(s > 0)) return;
  var ox = (W - this.bedX * s) / 2, oy = (H + this.bedY * s) / 2;
  this.lay = { s: s, ox: ox, oy: oy };
  function X(x) { return ox + x * s; }
  function Y(y) { return oy - y * s; }
  // Print bed
  c.fillStyle = "#fdfdfb"; c.fillRect(X(0), Y(this.bedY), this.bedX * s, this.bedY * s);
  c.strokeStyle = "#d4d4cf"; c.lineWidth = 1; c.beginPath();
  for (var gx = 50; gx < this.bedX; gx += 50) { c.moveTo(X(gx), Y(0)); c.lineTo(X(gx), Y(this.bedY)); }
  for (var gy = 50; gy < this.bedY; gy += 50) { c.moveTo(X(0), Y(gy)); c.lineTo(X(this.bedX), Y(gy)); }
  c.stroke();
  c.strokeStyle = "#555"; c.lineWidth = 1.5; c.strokeRect(X(0), Y(this.bedY), this.bedX * s, this.bedY * s);
  // Paper
  var inside = this.paperX >= 0 && this.paperY >= 0 && this.paperX + this.paperW <= this.bedX + 0.01 && this.paperY + this.paperH <= this.bedY + 0.01;
  c.fillStyle = "#ffffff"; c.fillRect(X(this.paperX), Y(this.paperY + this.paperH), this.paperW * s, this.paperH * s);
  c.strokeStyle = inside ? "#888" : "#d02020"; c.lineWidth = inside ? 1 : 2;
  c.strokeRect(X(this.paperX), Y(this.paperY + this.paperH), this.paperW * s, this.paperH * s);
  if (this.margin > 0 && this.paperW > 2 * this.margin && this.paperH > 2 * this.margin) {
    c.setLineDash([4, 4]); c.strokeStyle = "#aaa"; c.lineWidth = 1;
    c.strokeRect(X(this.paperX + this.margin), Y(this.paperY + this.paperH - this.margin), (this.paperW - 2 * this.margin) * s, (this.paperH - 2 * this.margin) * s);
    c.setLineDash([]);
  }
  // Reachable PEN TIP area after compensating the physical holder offset.
  var tx = this.toolX || 0, ty = this.toolY || 0;
  var bounds=this.headBounds||Engine.penBounds({bedX:this.bedX,bedY:this.bedY,toolX:tx,toolY:ty});
  var xmin=bounds.x0,xmax=bounds.x1,ymin=bounds.y0,ymax=bounds.y1;
  if (xmin>0 || ymin>0 || xmax<this.bedX || ymax<this.bedY) {
    c.fillStyle = "rgba(71,85,105,0.10)";
    c.fillRect(X(0),Y(this.bedY),xmin*s,this.bedY*s);
    c.fillRect(X(xmax),Y(this.bedY),(this.bedX-xmax)*s,this.bedY*s);
    c.fillRect(X(xmin),Y(this.bedY),(xmax-xmin)*s,(this.bedY-ymax)*s);
    c.fillRect(X(xmin),Y(ymin),(xmax-xmin)*s,ymin*s);
    c.setLineDash([5,4]); c.strokeStyle="#94a3b8"; c.lineWidth=1;
    c.strokeRect(X(xmin),Y(ymax),(xmax-xmin)*s,(ymax-ymin)*s); c.setLineDash([]);
  }
  var ux0=Math.max(this.paperX+this.margin,xmin), uy0=Math.max(this.paperY+this.margin,ymin);
  var ux1=Math.min(this.paperX+this.paperW-this.margin,xmax), uy1=Math.min(this.paperY+this.paperH-this.margin,ymax);
  if (ux1>ux0 && uy1>uy0) {
    c.setLineDash([3,3]);c.strokeStyle="#16824a";c.lineWidth=1.5;
    c.strokeRect(X(ux0),Y(uy1),(ux1-ux0)*s,(uy1-uy0)*s);c.setLineDash([]);
  }
  // Origin / labels
  c.fillStyle = "#777"; c.font = "11px sans-serif"; c.textAlign = "left"; c.textBaseline = "top";
  c.fillText("0,0", X(0) + 3, Y(0) - 14);
  var dx = this.sx + this.dragX, dy = this.sy + this.dragY;
  if (this.paths) {
    // Design frame
    if (this.frame) {
      c.setLineDash([5, 4]); c.strokeStyle = "#3b6fd4"; c.lineWidth = 1; c.beginPath();
      for (var i = 0; i < 4; i++) { var q = this.frame[i]; if (i === 0) c.moveTo(X(q.x + dx), Y(q.y + dy)); else c.lineTo(X(q.x + dx), Y(q.y + dy)); }
      c.closePath(); c.stroke(); c.setLineDash([]);
    }
    c.save();
    c.translate(ox + dx * s, oy - dy * s); c.scale(s, -s);
    c.lineJoin = "round"; c.lineCap = "round"; c.strokeStyle = "#000";
    c.lineWidth = Math.max(0.25, (this.penWidth||0.4) * s) / s;
    if (this.simOn) {
      if (this.simPath) c.stroke(this.simPath);
      if (this.simPartial && this.simPartial.length > 1) {
        c.beginPath(); c.moveTo(this.simPartial[0].x, this.simPartial[0].y);
        for (var k = 1; k < this.simPartial.length; k++) c.lineTo(this.simPartial[k].x, this.simPartial[k].y);
        c.stroke();
      }
    } else {
      var activeColor=null;
      for (var a = 0; a < this.paths.length; a++) {
        var color=(this.pathColors||[])[a]||'#000000';
        if(color!==activeColor){if(activeColor!==null)c.stroke();c.beginPath();c.strokeStyle=color;activeColor=color;}
        var p = this.paths[a]; c.moveTo(p[0].x, p[0].y);
        for (var b = 1; b < p.length; b++) c.lineTo(p[b].x, p[b].y);
      }
      if(activeColor!==null)c.stroke();
    }
    c.restore();
    if (this.simOn && this.simMk) {
      var mx = X(this.simMk.x + dx), my = Y(this.simMk.y + dy);
      c.beginPath(); c.arc(mx, my, 7, 0, 6.2832);
      if (this.simDown) { c.fillStyle = "rgba(220,40,40,.85)"; c.fill(); }
      c.strokeStyle = "#c01818"; c.lineWidth = 2; c.stroke();
    }
  }
  if (this.msg || !design) {
    c.fillStyle = "#666"; c.font = "15px sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(this.msg || "Load an SVG file or drag it here", W / 2, H / 2);
  }
};

// ------------------------------------------------------------------ Simulation
var simTimer = null, simLast = 0, simPlaying = false;
function simTotal() { return prev.paths && prev.mot ? prev.timeline().total : 0; }
function mss(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ":" + (sec % 60 < 10 ? "0" : "") + (sec % 60); }
function updateSimUi() {
  var has = !!(prev.paths && prev.paths.length > 0);
  U.btnPlay.disabled = !has; U.btnEnd.disabled = !has; U.trk.disabled = !has;
  U.btnPlay.textContent = simPlaying ? "Pause" : (prev.simOn && prev.simT > 0 && prev.simT < simTotal() ? "Resume" : "Start simulation");
  var tot = has ? simTotal() : 0;
  U.simTime.textContent = has ? mss(prev.simOn ? prev.simT : tot) + " / " + mss(tot) : "–";
  U.trk.value = has ? String(prev.simOn && tot > 0 ? Math.round(prev.simT / tot * 1000) : 1000) : "0";
}
function simPause() {
  simPlaying = false;
  if (simTimer) { cancelAnimationFrame(simTimer); simTimer = null; }
  updateSimUi();
}
function simFrame(now) {
  if (!simPlaying) return;
  var dt = (now - simLast) / 1000; simLast = now;
  var sp = parseFloat(U.speed.value) || 60;
  var t = prev.simT + Math.min(dt, 0.1) * sp, tot = simTotal();
  if (t >= tot) { prev.simSet(tot); simPause(); return; }
  prev.simSet(t); updateSimUi();
  simTimer = requestAnimationFrame(simFrame);
}
function simToggle() {
  if (!prev.paths || !prev.paths.length) return;
  if (simPlaying) { simPause(); return; }
  var tot = simTotal();
  if (!prev.simOn || prev.simT >= tot) prev.simSet(0);
  simPlaying = true; simLast = performance.now();
  updateSimUi();
  simTimer = requestAnimationFrame(simFrame);
}
function simEnd() {
  simPause();
  if (prev.paths) prev.simOff();
  updateSimUi();
}
function simScrub() {
  if (!prev.paths || !prev.paths.length) return;
  var v = parseInt(U.trk.value, 10) / 1000;   // read first: otherwise simPause() resets the slider
  var was = simPlaying; simPause();
  var tot = simTotal();
  if (v >= 1) { simEnd(); U.trk.value = "1000"; return; }
  prev.simSet(v * tot);
  updateSimUi();
  if (was) { simPlaying = true; simLast = performance.now(); simTimer = requestAnimationFrame(simFrame); updateSimUi(); }
}

// ------------------------------------------------------------------ Start
function init() {
  buildUi();
  buildExtendedUi();
  prev = new Preview($("cv"));
  U.modeLabel = h("button", { type: "button", cls: "modebtn", text: "Mode: Draw", title: "Switch between drawing and cutting", on: { click: function () { chooseMode(true).then(function (m) { if (m && m !== mode) applyMode(m); }); } } });
  document.querySelector("header.top").appendChild(U.modeLabel);
  loadSettings();
  updateStyleEnabled();
  updating = false;
  syncPreview();
  updateHeightLabel();
  updateInfo();
  updateSimUi();
  refreshModeUi();
  applyMode("draw");   // always start in draw mode; switch via the mode button
  $("fileIn").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  window.addEventListener("beforeunload", saveSettings);
  window.__stiftplotter = window.__homelabPlotter = {loadSvgText:loadSvgText,openProject:openProject,projectData:projectData,
    tools:Tools,engine:Engine,svgLoader:SvgLoader,compute:startCompute, machine:readMachine,
    state:function(){return {design:design,result:result,params:readParams(),groups:groupState,busy:busy};}};
}
init();
})();

</script>
